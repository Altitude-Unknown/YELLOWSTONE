name: Build Yellowstone Release

on:
  workflow_dispatch:
  push:
    tags:
      - "yellowstone-v*"

permissions:
  contents: write

env:
  WORKING_DIRECTORY: .
  SCRIPT_NAME: yellowstone_ground_station.py
  APP_NAME: Yellowstone Ground Station
  MACOS_ARTIFACT_NAME: Yellowstone-Ground-Station-macOS
  MACOS_ZIP_NAME: Yellowstone-Ground-Station-macOS.zip
  WINDOWS_ARTIFACT_NAME: Yellowstone-Ground-Station-Windows
  WINDOWS_ZIP_NAME: Yellowstone-Ground-Station-Windows.zip

jobs:
  build-macos:
    name: Build macOS Yellowstone Ground Station
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r requirements.txt

      - name: Import Apple Developer ID certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_BASE64" ]; then
            echo "No Developer ID certificate secret found; using ad-hoc signing."
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"

          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build, sign, and notarize macOS app
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          pyinstaller --noconfirm --windowed --hidden-import serial.tools.list_ports --name "$APP_NAME" "$SCRIPT_NAME"

          if [ -n "$APPLE_DEVELOPER_ID_APPLICATION" ]; then
            codesign --force --deep --options runtime --timestamp --sign "$APPLE_DEVELOPER_ID_APPLICATION" "dist/$APP_NAME.app"
          else
            codesign --force --deep --sign - "dist/$APP_NAME.app"
          fi

          codesign --verify --deep --strict --verbose=2 "dist/$APP_NAME.app"

          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            ditto -c -k --sequesterRsrc --keepParent "dist/$APP_NAME.app" "../notary-submit-$MACOS_ARTIFACT_NAME.zip"
            xcrun notarytool submit "../notary-submit-$MACOS_ARTIFACT_NAME.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
            xcrun stapler staple "dist/$APP_NAME.app"
            xcrun stapler validate "dist/$APP_NAME.app"
          else
            echo "No notarization secrets found; skipping notarization."
          fi

          ditto -c -k --sequesterRsrc --keepParent "dist/$APP_NAME.app" "../$MACOS_ZIP_NAME"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MACOS_ARTIFACT_NAME }}
          path: ${{ env.MACOS_ZIP_NAME }}

  build-windows:
    name: Build Windows Yellowstone Ground Station
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r requirements.txt

      - name: Build Windows executable
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          pyinstaller --noconfirm --onefile --windowed --hidden-import serial.tools.list_ports --name "$env:APP_NAME" "$env:SCRIPT_NAME"
          Compress-Archive -Path "dist/$env:APP_NAME.exe" -DestinationPath "../$env:WINDOWS_ZIP_NAME" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WINDOWS_ARTIFACT_NAME }}
          path: ${{ env.WINDOWS_ZIP_NAME }}

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-windows
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*.zip
